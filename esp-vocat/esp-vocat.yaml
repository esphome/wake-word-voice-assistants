substitutions:
  name: esp-vocat
  friendly_name: ESP-VoCat

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.0
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            // ESP-VoCat v1.2: GPIO48 enables codec power, GPIO15 enables amplifier
            // GPIO9 = BSP_LCD_EN (active-LOW via SAM8108 load switch): LOW enables LCD + SD power rail
            gpio_reset_pin(GPIO_NUM_9);
            gpio_set_direction(GPIO_NUM_9, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_9, 0);
            gpio_reset_pin(GPIO_NUM_48);
            gpio_set_direction(GPIO_NUM_48, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_48, 1);
            gpio_reset_pin(GPIO_NUM_15);
            gpio_set_direction(GPIO_NUM_15, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_15, 1);
            vTaskDelay(pdMS_TO_TICKS(50));

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_16KB: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  - platform: esphome

wifi:
  ap:

captive_portal:

audio:
  codecs:
    wav:
    flac:

# QSPI bus for ST77916 circular display
spi:
  - id: qspi_bus
    type: quad
    clk_pin: GPIO18
    data_pins: [GPIO46, GPIO13, GPIO11, GPIO12]

# ST77916 360×360 QSPI display (ESP-VoCat v1.2)
display:
  - platform: mipi_spi
    id: round_display
    spi_id: qspi_bus
    model: ESP-VOCAT
    update_interval: never

# I2C bus — ES8311 DAC (0x18), ES7210 ADC (0x40), BQ27220 battery (0x55), BMI270 IMU (0x68)
i2c:
  sda: GPIO2
  scl: GPIO1

# BMI270 6-axis IMU — temperature shown on display
motion:
  - platform: bmi270
    id: imu
    address: 0x68

sensor:
  - platform: bmi270
    bmi270_id: imu
    name: "IMU Temperature"
    id: imu_temp
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_label
          text: !lambda return str_sprintf("%.1f\xC2\xB0C", x);

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lvgl.label.update:
          id: time_label
          text: !lambda |
            auto t = id(ha_time).now();
            return str_sprintf("%02d:%02d", t.hour, t.minute);
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: time_label
              text: !lambda |
                auto t = id(ha_time).now();
                return str_sprintf("%02d:%02d", t.hour, t.minute);

lvgl:
  displays:
    - round_display
  pages:
    - id: clock_page
      bg_color: 0x000000
      widgets:
        - label:
            id: time_label
            text: "--:--"
            align: CENTER
            y: -30
            text_font: montserrat_48
            text_color: 0xFFFFFF
        - label:
            id: temp_label
            text: "--.-\xC2\xB0C"
            align: CENTER
            y: 40
            text_font: montserrat_24
            text_color: 0xAAAAAA

# Single I2S bus shared by microphone (RX) and speaker (TX)
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO39
    i2s_bclk_pin: GPIO40
    i2s_mclk_pin: GPIO42

# ES7210 4-channel microphone ADC
audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

# ES8311 speaker DAC (48 kHz — media player resamples TTS to this rate)
audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO3 # I2S_DIN v1.2 (GPIO15 on v1.0)
    adc_type: external
    channel: left
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO41
    dac_type: external
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: left
    buffer_duration: 100ms

media_player:
  - platform: speaker
    id: speaker_mp
    name: "${friendly_name}"
    volume_min: 0.0
    volume_max: 1.0
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: error_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_press.flac
    on_announcement:
      - micro_wake_word.stop:
    on_idle:
      - micro_wake_word.start:
    announcement_pipeline:
      speaker: spk
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# GPIO48 powers the ES8311/ES7210 codec pair (v1.2 only — handled in on_boot)
switch:
  - platform: gpio
    name: "Codec Power"
    id: codec_power
    pin: GPIO48
    restore_mode: ALWAYS_ON
    entity_category: diagnostic
    internal: true

voice_assistant:
  id: va
  microphone:
    microphone: mic
    channels: 0
  media_player: speaker_mp
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_idle:
    - micro_wake_word.start:
  on_timer_finished:
    - media_player.speaker.play_on_device_media_file:
        media_file: timer_finished_sound
        announcement: true
  on_error:
    - media_player.speaker.play_on_device_media_file:
        media_file: error_sound
        announcement: true
    - micro_wake_word.start:

micro_wake_word:
  id: mww
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:

# CST816S touch controller — no display support in ESPHome yet, so use
# the interrupt pin (GPIO10) directly. CST816S pulls GPIO10 LOW on touch,
# matching the stock firmware tap-to-talk behaviour.
#
# Capacitive touch pads embedded in the plastic housing
# v1.2: two-pad slider on GPIO6 + GPIO7 (swipe gesture)
# v1.0: single button on GPIO7 only
esp32_touch:
  setup_mode: false

binary_sensor:
  - platform: gpio
    name: "Screen Touch"
    id: screen_touch
    pin:
      number: GPIO10
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
          else:
            - voice_assistant.start:

  - platform: gpio
    name: "Boot Button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - voice_assistant.start:
    on_release:
      - voice_assistant.stop:

  # Housing capacitive touch (v1.2 slider pad 1 — can be used for mute, volume, etc.)
  - platform: esp32_touch
    name: "Touch Pad"
    pin: GPIO7
    threshold: 500
    internal: true

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: backlight_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    entity_category: config

  - platform: status_led
    name: "Status LED"
    id: led_status
    pin: GPIO43

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO44
